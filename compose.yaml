services:
  idrac-redfish-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: idrac-redfish-mcp:latest
    container_name: idrac-redfish-mcp
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "8088:8080"
    volumes:
      - ./src:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 1s
      timeout: 1s
      retries: 1
      start_period: 0s